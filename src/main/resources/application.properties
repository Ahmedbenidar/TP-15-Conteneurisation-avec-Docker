server.port=8111
spring.application.name=conteneur-mediatheque

# Valeurs par defaut pour une execution locale (MySQL de la machine hote sur le port 3307).
# En conteneur, docker-compose ecrase ces valeurs par des variables d'environnement.
spring.datasource.url=jdbc:mysql://localhost:3307/mediatheque_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=mediatheque
spring.datasource.password=Mediatheque2026!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
